<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TrapGate Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      color: white;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: url("{{ url_for('static', filename='green-matrix-bg.gif') }}") no-repeat center center fixed;
      background-size: cover;
      z-index: -1;
      filter: brightness(0.4);
    }

    .dashboard-container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      color: #00ff00;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #00ff00;
    }

    p {
      font-size: 18px;
      color: #ccc;
    }

    .button {
      margin-top: 30px;
      padding: 12px 20px;
      font-size: 16px;
      background-color: #00ff00;
      border: none;
      border-radius: 6px;
      color: black;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px #00ff00;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <h1> Welcome to TrapGate Dashboard</h1>
    <p>Your session is secure. Stay vigilant!</p>
    <form action="/">
      <button class="button">Log Out</button>
    </form>
  </div>

</body>
</html>
