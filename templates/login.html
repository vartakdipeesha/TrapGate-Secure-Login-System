<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TrapGate Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      background: black;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("/static/red-matrix-bg.gif");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;  
      z-index: -1;
      filter: brightness(0.4);
    }

    .center-container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 40px 30px;
      width: 360px;
      text-align: center;
      box-shadow: 0 0 20px red;
      border: 1px solid rgba(255, 0, 0, 0.3);
      color: #fff;
      position: relative;
      z-index: 2;
    }

    .glitch {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      color: #ff1c1c;
      text-shadow: 0 0 4px #ff0000;
      animation: glitch 1.3s infinite;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    @keyframes glitch {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
    }

    .login-card label {
      text-align: left;
      font-size: 14px;
      margin-top: 10px;
      display: block;
    }

    .login-card input[type="text"],
    .login-card input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 14px;
    }

    .login-card input[type="submit"] {
      width: 100%;
      padding: 12px;
      background: #ff1c1c;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .login-card input[type="submit"]:hover {
      background: #e60000;
      box-shadow: 0 0 10px red;
    }

    .disabled-btn {
      background: grey !important;
      cursor: not-allowed;
    }

    .alert-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      animation: fadeIn 0.4s ease-in-out;
    }

    .alert-box {
      background: rgba(45, 0, 0, 0.8);
      border: 2px solid #e60000;
      padding: 30px 25px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 35px rgba(230, 0, 0, 0.8);
      color: #ffe6e6;
      font-family: 'Orbitron', sans-serif;
    }

    .alert-box .glitch {
      font-size: 2.2rem;
      margin-bottom: 12px;
    }

    .alert-box p {
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .alert-box button {
      padding: 10px 24px;
      background: #e60000;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .alert-box button:hover {
      background: #cc0000;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="center-container">
    <div class="login-card">
      <div class="glitch">TrapGate Login</div>
      <form action="/trap" method="post" onsubmit="playBeep()">
        <label for="email">Email</label>
        <input type="text" name="email" id="email" placeholder="you@example.com" required {% if blocked %}disabled{% endif %}>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="********" required {% if blocked %}disabled{% endif %}>

        <input type="submit" id="login-btn" value="Login" {% if blocked %}class="disabled-btn" disabled{% endif %}>
      </form>
    </div>
  </div>

  <audio id="beep" src="{{ url_for('static', filename='beep.mp3') }}" preload="auto"></audio>
  <script>
    function playBeep() {
      document.getElementById('beep').play();
    }

    function hideAlert() {
      const alert = document.getElementById("glitch-alert");
      if (alert) alert.style.display = "none";
    }
  </script>

  {% if blocked %}
  <div id="glitch-alert" class="alert-overlay">
    <div class="alert-box">
      <div class="glitch">ACCESS DENIED</div>
      <p>Suspicious activity detected for<br><strong>{{ email }}</strong></p>
      <button onclick="hideAlert()">Try Again</button>
    </div>
  </div>
  {% endif %}

</body>
</html>
