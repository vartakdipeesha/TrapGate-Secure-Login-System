<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify OTP - TrapGate</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h2 {
      color: #ff1c1c;
      margin-bottom: 20px;
    }

    .otp-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .otp-box {
      width: 40px;
      height: 50px;
      font-size: 24px;
      text-align: center;
      border-radius: 6px;
      border: none;
      outline: none;
      background-color: aliceblue;
      color: black;
    }

    input[type="submit"],
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      background-color: #ff1c1c;
      font-size: 16px;
      width: 220px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      margin-top: 10px;
    }

    .error {
      color: yellow;
      margin-top: 15px;
    }

    #timer {
      margin-top: 10px;
      color: lightgrey;
    }

    .resend-btn {
      background-color: #222;
      color: #ff1c1c;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Enter One-Time Password</h2>

  <form id="otpForm" action="/verify-otp" method="post" style="display: flex; flex-direction: column; align-items: center;">
    <div class="otp-container">
      <input class="otp-box" type="text" maxlength="1" />
      <input class="otp-box" type="text" maxlength="1" />
      <input class="otp-box" type="text" maxlength="1" />
      <input class="otp-box" type="text" maxlength="1" />
      <input class="otp-box" type="text" maxlength="1" />
      <input class="otp-box" type="text" maxlength="1" />
    </div>

    <input type="hidden" id="otp" name="otp" />
    <input type="submit" value="Verify OTP">
  </form>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <p id="timer">Expiry in <span id="timeLeft">120</span> seconds</p>

  <form action="/resend-otp" method="post">
    <button type="submit" class="resend-btn">🔁 Resend OTP</button>
  </form>

  <script>
    // OTP combine input
    const boxes = document.querySelectorAll('.otp-box');
    const hiddenInput = document.getElementById('otp');

    boxes.forEach((box, index) => {
      box.addEventListener('input', () => {
        if (box.value.length === 1 && index < boxes.length - 1) {
          boxes[index + 1].focus();
        }
        updateOTP();
      });

      box.addEventListener('keydown', (e) => {
        if (e.key === "Backspace" && box.value === "" && index > 0) {
          boxes[index - 1].focus();
        }
      });
    });

    function updateOTP() {
      let otp = '';
      boxes.forEach(box => otp += box.value);
      hiddenInput.value = otp;
    }

    // Timer countdown
    let timeLeft = 120;
    const timerDisplay = document.getElementById("timeLeft");

    const countdown = setInterval(() => {
      timeLeft--;
      timerDisplay.textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(countdown);
        document.getElementById("timer").textContent = " OTP expired.";
      }
    }, 1000);
  </script>

</body>
</html>
